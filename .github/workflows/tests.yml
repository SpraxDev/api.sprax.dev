name: Tests + SonarCloud

on:
  push:
    branches:
      - full-recode
      - main
  pull_request:
    branches:
      - full-recode
      - main

  # Monthly run so the SonarCloud scan uses SONAR_TOKEN, which expires after 60 days without use
  schedule:
    - cron: '17 4 1 * *'

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    concurrency:
      group: acceptance-tests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system packages needed for headless gl
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential
          libgl1-mesa-dri
          libglapi-mesa
          libglew-dev
          libglu1-mesa-dev
          libosmesa6
          libxi-dev
          mesa-utils
          pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci
      - name: Run the tests
        run: xvfb-run npm run test:ci

      - name: Upload coverage report
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud
    needs: tests
    if: '!cancelled()'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: env.SONAR_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies for type resolution
        if: env.SONAR_TOKEN != ''
        run: npm ci --ignore-scripts && npm run prisma:generate

      - name: Download coverage report
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Run SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.organization=spraxdev
            -Dsonar.projectKey=SpraxDev_api.sprax.dev
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.typescript.tsconfigPaths=tsconfig.json
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
            -Dsonar.sources=src/
            -Dsonar.exclusions=src/database/prisma-client/**
            -Dsonar.tests=tests/
            -Dsonar.test.inclusions=tests/**/*.test.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
